apiVersion: v1
kind: Service
metadata:
  name: blue-green-active
  namespace: blue-green
spec:
  selector:
    app: blue-green-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: blue-green-preview
  namespace: blue-green
spec:
  selector:
    app: blue-green-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000